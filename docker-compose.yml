# Local Postgres for development. Reads the same DB_* variables as db.py from .env.
# Host port 5433 avoids clashing with a locally installed Postgres on 5432,
# so set DB_PORT=5433 in .env when using this container. DB_USER and DB_PASSWORD
# are required (no fallbacks) so the container and db.py always agree on credentials.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-nutrition_db}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
